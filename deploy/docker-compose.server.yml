# deploy/docker-compose.server.yml —— 线上那台机器（阿里云 47.102.100.84）的真实配置
#
# 用法（在服务器上的仓库目录里）：
#   docker compose -f deploy/docker-compose.server.yml up -d --build
#
# 和根目录 docker-compose.yml 的区别：
#   根目录那份是「一台机器全包」（Caddy 也跑容器里、占 80/443）
#   这份只跑 pii，TLS 由宿主机上的 systemd Caddy 负责（因为 80 被 teslamate 占了）

services:
  pii:
    build:
      context: ..
      dockerfile: Dockerfile
    image: pii:server
    container_name: pii-test
    restart: unless-stopped
    environment:
      PII_AUTH: "1"
      # 默认工作目录 = 项目根。每个项目是 /projects/<名字> 一个子目录。
      PII_CWD: /projects
      PII_HOST: 0.0.0.0
      PII_PORT: "8443"
      PII_PROVIDER: magpie
      PII_MODEL: mac/auto/gemini-2.5-flash-lite
      PII_DATA_DIR: /data
      # 这台机器只有 1.8G 内存，限制 node 堆，避免把 teslamate 挤死
      NODE_OPTIONS: --max-old-space-size=384
      NODE_ENV: production
    volumes:
      # agent 的文件世界：宿主机 /srv/projects 就是「项目根」
      - /srv/projects:/projects
      # 兼容别名：改动前的老会话 cwd 存的是 /work，指到同一个目录免得它们全失效。
      # 想彻底干净：在界面上把每个会话的目录改成 /projects，再删掉这一行。
      - /srv/projects:/work
      # 会话 / 令牌 / 推送订阅（sqlite，绝不能丢）
      - /opt/pii-test/data:/data
      # 模型清单，只读挂载；里面有明文密钥，不进仓库
      - /opt/pii-test/models/models.json:/root/.pi/agent/models.json:ro
      # 自我更新：pii 在这里改自己的源码（改的是 git 工作区，不影响运行中的镜像）
      - /srv/pii-src:/pii-src
      # 自我更新的控制面板：写 request 触发宿主机部署，读 status.json 看结果
      - /srv/pii-deploy:/pii-deploy
    ports:
      # 只绑回环 —— 外部唯一入口是 Caddy 的 443。
      # 想临时绕过 Caddy 调试，把下面改成 "8443:8443"。
      - "127.0.0.1:8443:8443"
    networks:
      - pii-net

networks:
  pii-net:
    # 容器重建时不希望网络跟着消失（其它容器也在用）
    external: true
