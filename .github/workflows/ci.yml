name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 安装服务端依赖
        run: npm ci

      - name: 安装前端依赖
        run: npm --prefix web ci

      - name: 单元测试
        run: npm test

      - name: 类型检查 + 前端构建
        run: npm run check

      - name: Lint
        run: npm --prefix web run lint
